x-flink-properties: &flink-properties |
  jobmanager.rpc.address: jobmanager
  taskmanager.numberOfTaskSlots: 4
  parallelism.default: 2
  state.backend.type: rocksdb
  state.backend.incremental: true
  state.checkpoints.dir: file:///opt/flink/checkpoints
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: 9249

x-flink-image: &flink-image flink:1.20-java17

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        for t in trades prices position-by-account-ticker; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 4 --replication-factor 1
        done
    restart: "no"

  jobmanager:
    image: *flink-image
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./data/checkpoints:/opt/flink/checkpoints

  taskmanager:
    image: *flink-image
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - ./data/checkpoints:/opt/flink/checkpoints

  job-submit:
    image: *flink-image
    depends_on:
      jobmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    entrypoint:
      - bash
      - -c
      - |
        for i in $$(seq 1 30); do
          flink run -m jobmanager:8081 -d -c com.demo.flink.pipeline.PositionPipeline /opt/app/flink-demo.jar --config /opt/config/application.properties && exit 0
          echo "submit failed, retrying ($$i)..."; sleep 3
        done
        exit 1
    volumes:
      - ./target:/opt/app:ro
      - ./config:/opt/config:ro
    restart: "no"

  generator:
    image: eclipse-temurin:17-jre
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - java
      - -cp
      - /opt/app/flink-demo.jar
      - com.demo.flink.generator.DataGenerator
      - --config
      - /opt/config/application.properties
    restart: unless-stopped
    volumes:
      - ./target:/opt/app:ro
      - ./config:/opt/config:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
