# All runtime behavior is controlled here — changing anything below requires NO rebuild.

# --- Kafka ---
kafka.bootstrap.servers=kafka:9092
kafka.group.id=flink-demo-positions
topic.trades=trades
topic.prices=prices
topic.position.account.ticker=position-by-account-ticker
topic.position.ticker=position-by-ticker
topic.mv.account.ticker=mv-by-account-ticker
topic.mv.ticker=mv-by-ticker

# --- Pipeline ---
# Which implementation of the same contract runs: datastream (default) or sql.
# Same jar, same topics, same JSON either way.
pipeline.mode=datastream
pipeline.parallelism=2
checkpoint.interval.ms=10000
dedup.state.ttl.ms=3600000
# Price-driven MV re-valuation conflation window (ms); 0 = re-value on every tick
mv.reval.interval.ms=250

# --- Sinks (both modes read this; the DataStream job is pinned at-least-once) ---
# at-least-once (default) | exactly-once | none. Only the SQL mode honours it today.
sink.delivery.guarantee=at-least-once
# Transactional id prefix, only used when the guarantee is exactly-once.
#sink.transactional.id.prefix=flink-demo-sql

# --- SQL mode only ---
# Per-key output cadence is enforced at the upsert-kafka sink buffer (the SQL
# analogue of the DataStream emit timers). These reuse the DataStream knobs:
#   position.emit.interval.ms (default 500), mv.emit.interval.ms (default 1000)
#sql.sink.buffer.max.rows=5000
# Price tick conflation. 0 (default) = keep-last-row on arrival order, which
# matches the DataStream latest-price state and never stalls. >0 switches to the
# event-time TUMBLE conflation from confluent/sql/optimized/statement_set.sql,
# which needs a continuously flowing price stream to advance watermarks.
#sql.price.conflate.ms=250
# Mini-batch aggregation/join. Off by default so latency matches DataStream.
#sql.minibatch.latency.ms=200
#sql.minibatch.size=5000
# Job-wide SQL state TTL (ms). NOT the same as dedup.state.ttl.ms: SQL cannot
# scope a TTL to the dedup operator, so enabling this also expires the position
# aggregates. 0 (default) = never expire.
#sql.state.ttl.ms=0

# --- Data generator ---
generator.trades.per.sec=10
generator.prices.per.sec=20
generator.accounts=5
generator.tickers=10
generator.seed=42
generator.duplicate.ratio=0.05
# Case 2 perf test: set to a huge value (in cents) to pin all prices, -1 = normal random walk
generator.price.cents.override=-1
